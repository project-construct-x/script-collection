{{- if eq (include "conxdc.vaultInit.jobEnabled" .) "true" }}
{{- $saName := include "conxdc.vaultInit.serviceAccountName" . }}
---
# Dedicated ServiceAccount of the vault-init job.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace | default "default" | quote }}
  labels:
    {{- include "conxdc.labels" . | nindent 4 }}
automountServiceAccountToken: false

{{- if eq (include "conxdc.vault.autoInit.enabled" .) "true" }}
---
# Role and RoleBinding is only rendered with autoInit
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace | default "default" | quote }}
  labels:
    {{- include "conxdc.labels" . | nindent 4 }}
rules:
  # can create secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # can read and update Vault specific secrets
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ include "conxdc.vault.autoInit.keysSecretName" . | quote }}
      - {{ include "conxdc.appTokenSecretName" . | quote }}
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace | default "default" | quote }}
  labels:
    {{- include "conxdc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace | default "default" | quote }}
{{- end }}
{{- end }}