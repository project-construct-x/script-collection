---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "wallet.fullname" . }}-test"
  labels:
    {{- include "wallet.server.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": {{ .Values.tests.hookDeletePolicy }}
spec:
  {{- include "wallet.imagePullSecrets" (dict "context" $) | nindent 2 }}
  containers:
    - name: readiness
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      command: ["curl", "-fsS", "--max-time", "10", "-o", "/dev/null"]
      args: ["http://{{ include "wallet.serviceHostname" . }}:{{ .Values.wallet.endpoints.default.port }}{{ .Values.wallet.endpoints.default.path }}/check/readiness"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]  
  restartPolicy: Never
  securityContext:
    fsGroup: 101 # curl_group
    runAsGroup: 101 # curl_group
    runAsNonRoot: true
    runAsUser: 100 # curl_user
    seccompProfile:
      type: RuntimeDefault