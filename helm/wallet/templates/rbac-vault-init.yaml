{{- if and (eq (include "common.vaultInit.jobEnabled" .) "true") .Values.vaultInit.autoInit.enabled -}}
{{- $fullName := include "wallet.fullname" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullName }}-vault-init
  namespace: {{ .Release.Namespace | default "default" | quote }}
  labels:
    {{- include "wallet.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}-vault-init
  namespace: {{ .Release.Namespace | default "default" | quote }}
  labels:
    {{- include "wallet.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullName }}-vault-init
subjects:
- kind: ServiceAccount
  name: {{ include "wallet.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | default "default" | quote }}
{{- end }}