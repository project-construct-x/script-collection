#################################################################################
# Example override values — wallet
# Mode: hashicorp-dev  (bundled HashiCorp Vault in dev mode, in-memory)
#################################################################################

install:
  postgresql: true
  vault: true

imagePullSecrets: []

# -- Secret initialisation
vaultInit:
  mode: hashicorp-dev
  enabled: true
  aes:
    enabled: true
    alias: "wallet-aes-key-alias"
  # autoInit is not used in dev mode
  autoInit:
    enabled: false

wallet:
  # -- Public hostname. Used in did:web URLs and ingress routing. 
  hostname: "wallet.staging.construct-x.net"

  image:
    repository: "ghcr.io/project-construct-x/wallet"

  superuser:
    createSecret: true
    id: admin
    # WARNING: default API key. Format base64(<id>).<random>. Change before use.
    apiKey: YWRtaW4.adminKey

  # -- Public ingress
  ingresses:
    - enabled: true
      hostname: "wallet.staging.construct-x.net"
      className: "nginx"
      endpoints: [credentials, did, sts]
      tls:
        enabled: true
        secretName: "wallet-tls"
      certManager:
        clusterIssuer: "letsencrypt-staging"

postgresql:
  auth:
    database: "wallet"
    username: "user"
    # WARNING: default password — change before use.
    password: "password"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

vault:
  server:
    dev:
      enabled: true
      # WARNING: dev-mode default token. Change before use.
      devRootToken: "root"
  hashicorp:
    url: "http://{{ .Release.Name }}-vault:8200"
    # WARNING: dev-mode default token. Change before use.
    token: "root"
