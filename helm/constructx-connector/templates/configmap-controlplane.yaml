---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "conxdc.fullname" . }}-controlplane
  namespace: {{ .Release.Namespace | default "default" | quote }}
  labels:
    {{- include "conxdc.controlplane.labels" . | nindent 4 }}
data:
  ############
  # DEFAULTS #
  ############
  EDC_IAM_DID_WEB_USE_HTTPS: "true"
  TX_EDC_POSTGRESQL_MIGRATION_ASSET_ENABLED: "false"
  TX_EDC_POSTGRESQL_MIGRATION_AGREEMENTBPNS_ENABLED: "false"
  TX_EDC_POSTGRESQL_MIGRATION_BPN_ENABLED: "false"
  TX_EDC_POSTGRESQL_MIGRATION_CONTRACTDEFINITION_ENABLED: "false"
  TX_EDC_POSTGRESQL_MIGRATION_CONTRACTNEGOTIATION_ENABLED: "false"
  TX_EDC_POSTGRESQL_MIGRATION_DATAPLANEINSTANCE_ENABLED: "false"
  TX_EDC_POSTGRESQL_MIGRATION_EDR_ENABLED: "false"
  TX_EDC_POSTGRESQL_MIGRATION_FEDERATEDCATALOG_ENABLED: "false"
  TX_EDC_POSTGRESQL_MIGRATION_JTI-VALIDATION_ENABLED: "false"
  TX_EDC_POSTGRESQL_MIGRATION_POLICY-MONITOR_ENABLED: "false"
  TX_EDC_POSTGRESQL_MIGRATION_POLICY_ENABLED: "false"
  TX_EDC_POSTGRESQL_MIGRATION_TRANSFERPROCESS_ENABLED: "false"
  EDC_IAM_CREDENTIAL_REVOCATION_MIMETYPE: "application/json"
  TX_EDC_IAM_IATP_DEFAULT-SCOPES_TEST_ALIAS: "org.eclipse.dspace.dcp.vc.type"
  TX_EDC_IAM_IATP_DEFAULT-SCOPES_TEST_TYPE: "MembershipCredential"
  TX_EDC_IAM_IATP_DEFAULT-SCOPES_TEST_OPERATION: "read"

  #######
  # API #
  #######
  WEB_HTTP_PORT: {{ .Values.controlplane.endpoints.default.port | quote }}
  WEB_HTTP_PATH: {{ .Values.controlplane.endpoints.default.path | quote }}
  WEB_HTTP_MANAGEMENT_PORT: {{ .Values.controlplane.endpoints.management.port | quote }}
  WEB_HTTP_MANAGEMENT_PATH: {{ .Values.controlplane.endpoints.management.path | quote }}
  WEB_HTTP_CONTROL_PORT: {{ .Values.controlplane.endpoints.control.port | quote }}
  WEB_HTTP_CONTROL_PATH: {{ .Values.controlplane.endpoints.control.path | quote }}
  WEB_HTTP_PROTOCOL_PORT: {{ .Values.controlplane.endpoints.protocol.port | quote }}
  WEB_HTTP_PROTOCOL_PATH: {{ .Values.controlplane.endpoints.protocol.path | quote }}
  WEB_HTTP_VALIDATION_PORT: {{ .Values.controlplane.endpoints.validation.port | quote }}
  WEB_HTTP_VALIDATION_PATH: {{ .Values.controlplane.endpoints.validation.path | quote }}

  ###########
  # General #
  ###########
  EDC_HOSTNAME: {{ .Values.controlplane.hostname | quote }}
  EDC_SQL_SCHEMA_AUTOCREATE: {{ .Values.controlplane.schema.autocreate | quote }}
  EDC_RUNTIME_ID: {{ printf "%s-controlplane" (include "conxdc.fullname" .) | quote }}

  {{- if .Values.log4j2.enableJsonLogs }}
  LOG4J_CONFIGURATION_FILE: "/app/log4j2.yaml"
  {{- end }}

  ####################
  # ID CONFIGURATION #
  ####################
  EDC_PARTICIPANT_ID: {{ .Values.iatp.id | required ".Values.iatp.id is required" | quote }}
  EDC_IAM_ISSUER_ID: {{ .Values.iatp.id | required ".Values.iatp.id is required" | quote }}
  EDC_IAM_TRUSTED-ISSUER_EXAMPLE_ID: {{ .Values.iatp.trustedIssuerId | required ".Values.iatp.trustedIssuerId is required" | quote }}
  {{- range $index, $issuer := .Values.iatp.trustedIssuers }}
  {{- if eq (kindOf $issuer) "string" }}
  EDC_IAM_TRUSTED-ISSUER_{{ $index }}-ISSUER_ID: {{ $issuer | quote }}
  {{- else }}
  EDC_IAM_TRUSTED-ISSUER_{{ $index }}-ISSUER_ID: {{ $issuer.id | quote }}
  {{- if $issuer.supportedTypes }}
  EDC_IAM_TRUSTED-ISSUER_{{ $index }}-ISSUER_SUPPORTEDTYPES: {{ $issuer.supportedTypes | toJson | quote }}
  {{- end }}
  {{- end }}
  {{- end }}

  ###################
  # Management Auth #
  ###################
  {{- if .Values.controlplane.endpoints.management.jwksUrl }}
  WEB_HTTP_MANAGEMENT_AUTH_DAC_KEY_URL: {{ .Values.controlplane.endpoints.management.jwksUrl | quote }}
  WEB_HTTP_MANAGEMENT_AUTH_TYPE: "delegated"
  {{- else }}
  WEB_HTTP_MANAGEMENT_AUTH_TYPE: "tokenbased"
  {{- end }}

  #######
  # DSP #
  #######
  EDC_DSP_CALLBACK_ADDRESS: {{ printf "%s%s" (include "conxdc.controlplane.url.protocol" .) .Values.controlplane.endpoints.protocol.path | quote }}
  EDC_OAUTH_PROVIDER_AUDIENCE: "idsc:IDS_CONNECTORS_ALL"
  EDC_OAUTH_ENDPOINT_AUDIENCE: {{ printf "%s%s" (include "conxdc.controlplane.url.protocol" .) .Values.controlplane.endpoints.protocol.path | quote }}
  
  ##############
  # Datasource #
  ##############
  EDC_DATASOURCE_DEFAULT_URL: {{ tpl .Values.postgresql.jdbcUrl . | quote }}

  ###########################
  # IATP / STS / DIV CONFIG #
  ###########################
  EDC_IAM_STS_OAUTH_TOKEN_URL: {{ .Values.iatp.sts.oauth.token_url | required ".Values.iatp.sts.oauth.token_url is required" | quote }}
  EDC_IAM_STS_OAUTH_CLIENT_ID: {{ .Values.iatp.sts.oauth.client.id | required ".Values.iatp.sts.oauth.client.id is required" | quote }}
  EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS: {{ .Values.iatp.sts.oauth.client.secret_alias | required ".Values.iatp.sts.oauth.client.secret_alias is required" | quote }}
  {{- if .Values.iatp.sts.div.url }}
  TX_EDC_IAM_STS_DIV_URL: {{ .Values.iatp.sts.div.url | quote }}
  {{- end }}

  #############
  # DID / DCP #
  #############
  TX_EDC_DID_SERVICE_SELF_REGISTRATION_ENABLED: {{ .Values.iatp.didService.selfRegistration.enabled | quote }}
  TX_EDC_DID_SERVICE_SELF_DEREGISTRATION_ENABLED: {{ and (eq (int .Values.controlplane.replicaCount) 1) (not .Values.controlplane.autoscaling.enabled) | quote }}
  TX_EDC_DID_SERVICE_SELF_REGISTRATION_ID: {{ .Values.iatp.didService.selfRegistration.id | quote }}
  TX_EDC_DCP_CACHE_ENABLED: {{ .Values.iatp.cache.enabled | quote }}
  TX_EDC_DCP_CACHE_VALIDITY_SECONDS: {{ .Values.iatp.cache.validity | quote }}

  #########
  # VAULT #
  #########
  EDC_VAULT_HASHICORP_URL: {{ tpl .Values.vault.hashicorp.url . | quote }}
  EDC_VAULT_HASHICORP_TIMEOUT_SECONDS: {{ .Values.vault.hashicorp.timeout | quote }}
  EDC_VAULT_HASHICORP_HEALTH_CHECK_ENABLED: {{ .Values.vault.hashicorp.healthCheck.enabled | quote }}
  EDC_VAULT_HASHICORP_HEALTH_CHECK_STANDBY_OK: {{ .Values.vault.hashicorp.healthCheck.standbyOk | quote }}
  EDC_VAULT_HASHICORP_API_SECRET_PATH: {{ .Values.vault.hashicorp.paths.secret | quote }}
  EDC_VAULT_HASHICORP_API_HEALTH_CHECK_PATH: {{ .Values.vault.hashicorp.paths.health | quote }}
  {{- if .Values.vault.hashicorp.paths.folder }}
  EDC_VAULT_HASHICORP_FOLDER: {{ .Values.vault.hashicorp.paths.folder | quote }}
  {{- end }}

  #################
  # POLICY ENGINE #
  #################
  EDC_POLICY_VALIDATION_ENABLED: {{ .Values.controlplane.policy.validation.enabled | quote }}