# this deployment keeps a persistent vault unsealed after a vault pod restart (autoInit only, non-prod).
{{- if eq (include "conxdc.vault.unsealer.enabled" .) "true" }}
{{- $fullName := include "conxdc.fullname" . }}
{{- $unsealer := .Values.vaultInit.autoInit.unsealer }}
{{- $selectorLabels := dict "app.kubernetes.io/name" (printf "%s-vault-unsealer" (include "conxdc.name" .)) "app.kubernetes.io/instance" .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-vault-unsealer
  namespace: {{ .Release.Namespace | default "default" | quote }}
  labels:
    {{- include "conxdc.labels" . | nindent 4 }}
    {{- toYaml $selectorLabels | nindent 4 }}
    app.kubernetes.io/component: vault-unsealer
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- toYaml $selectorLabels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "conxdc.labels" . | nindent 8 }}
        {{- toYaml $selectorLabels | nindent 8 }}
        app.kubernetes.io/component: vault-unsealer
    spec:
      {{- include "conxdc.imagePullSecrets" (dict "context" $) | nindent 6 }}
      serviceAccountName: {{ include "conxdc.serviceAccountName" . }}
      automountServiceAccountToken: false
      # Least privileges - deployment only needs mounted secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vault-unsealer
          # Uses same image as Vault-Init job
          image: {{ include "conxdc.vaultInit.image" . }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              VAULT="${VAULT_ADDR:?VAULT_ADDR is required}"
              INTERVAL="${INTERVAL:-300}"
              KEY_FILE=/keys/unseal-key

              # Log function
              log() { echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] $*" >&2; }

              log "Watching seal status of $VAULT every ${INTERVAL}s"
              # Poll every INTERVAL
              while true; do
                # Gets seal-status or sets exit-code to 0 if not reachable
                status=$(wget -qO- -T 5 "$VAULT/v1/sys/seal-status" 2>/dev/null || true)
                # Check for initialized and sealed Vault
                if echo "$status" | grep -q '"initialized":true' && echo "$status" | grep -q '"sealed":true'; then
                  if [ -s "$KEY_FILE" ]; then
                    log "Vault is sealed, unsealing..."
                    # Construct key body
                    body=$(printf '{"key":"%s"}' "$(cat "$KEY_FILE")")
                    # POST body to Vault and check seal-status in response
                    if wget -qO- -T 5 --header "Content-Type: application/json" --post-data "$body" \
                         "$VAULT/v1/sys/unseal" 2>/dev/null | grep -q '"sealed":false'; then
                      log "Vault unsealed."
                    else
                      log "ERROR: unseal failed - the stored unseal key may not match this Vault."
                    fi
                  else
                    log "Vault is sealed but $KEY_FILE is not available yet - the Vault-Init job may still be running."
                  fi
                fi
                sleep "$INTERVAL"
              done
          env:
            - name: VAULT_ADDR
              value: {{ include "conxdc.vault.url" . | quote }}
            - name: INTERVAL
              value: {{ $unsealer.interval | default 300 | quote }}
          # Least privileges - deployment only needs mounted secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- with $unsealer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: unseal-key
              mountPath: /keys
              readOnly: true
      volumes:
        - name: unseal-key
          secret:
            # Mounts secret created by the Vault-Init job after the first install
            secretName: {{ include "conxdc.vault.autoInit.keysSecretName" . }}
            optional: true
            items:
              - key: unseal-key
                path: unseal-key
{{- end }}