---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "conxdc.serviceHostname" (dict "context" $ "plane" "controlplane") }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.controlplane.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "conxdc.controlplane.labels" . | nindent 4 }}
    {{- with .Values.controlplane.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.controlplane.service.type }}
  ports:
  {{- range $name, $endpoint := .Values.controlplane.endpoints }}
    - port: {{ $endpoint.port }}
      targetPort: {{ $name }}
      protocol: TCP
      name: {{ $name }}
  {{- end }}
  selector:
    {{- include "conxdc.controlplane.selectorLabels" . | nindent 4 }}