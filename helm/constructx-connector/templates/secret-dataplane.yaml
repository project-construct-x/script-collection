---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conxdc.fullname" . }}-dataplane
  namespace: {{ .Release.Namespace | default "default" | quote }}
  labels:
    {{- include "conxdc.dataplane.labels" . | nindent 4 }}
type: Opaque
stringData:
  ##############
  # DATASOURCE #
  ##############
  EDC_DATASOURCE_DEFAULT_USER: {{ .Values.postgresql.auth.username | required ".Values.postgresql.auth.username is required" | quote }}
  EDC_DATASOURCE_DEFAULT_PASSWORD: {{ .Values.postgresql.auth.password | required ".Values.postgresql.auth.password is required" | quote }}

  ####################
  # PROXY / DPF AUTH #
  ####################
  TX_EDC_DPF_CONSUMER_PROXY_AUTH_APIKEY: {{ .Values.dataplane.endpoints.proxy.authKey | required ".Values.dataplane.endpoints.proxy.authKey is required" | quote }}

  #########
  # AWS   #
  #########
  {{- if .Values.dataplane.aws.secretAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.dataplane.aws.secretAccessKey | quote }}
  {{- end }}
  {{- if .Values.dataplane.aws.accessKeyId }}
  AWS_ACCESS_KEY_ID: {{ .Values.dataplane.aws.accessKeyId | quote }}
  {{- end }}

  #########
  # VAULT #
  #########
  {{- if not (eq (include "conxdc.vault.autoInit.enabled" .) "true") }}
  EDC_VAULT_HASHICORP_TOKEN: {{ include "conxdc.vault.token" . | required ".Values.vault.hashicorp.token is required" | quote }}
  {{- end }}
