{{- $fullName := include "conxdc.fullname" . -}}
{{- $controlLabels := include "conxdc.controlplane.labels" . -}}
{{- $controlEdcEndpoints := .Values.controlplane.endpoints -}}
{{- $serviceName := include "conxdc.serviceHostname" (dict "context" $ "plane" "controlplane") -}}
{{- $namespace := .Release.Namespace -}}

{{- range $index, $ingress := .Values.controlplane.ingresses -}}
{{- if and .enabled .endpoints -}}
{{- $host := include "conxdc.ingress.host" (dict "context" $ "item" . "plane" "controlplane") -}}
{{- $className := include "conxdc.ingress.className" (dict "context" $ "item" .) -}}
{{- $controlIngressName := include "conxdc.ingress.name" (dict "context" $ "plane" "controlplane" "index" $index) -}}
{{- $annotations := include "conxdc.ingress.annotations" (dict "context" $ "item" . "host" $host) | fromYaml }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $controlIngressName }}
  namespace: {{ $namespace | default "default" | quote }}
  labels:
    {{- $controlLabels | nindent 4 }}
  annotations:
    {{- with $annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if $className }}
  ingressClassName: {{ $className }}
  {{- end }}
  {{- if $host }}
  {{- if (.tls).enabled }}
  tls:
    - hosts:
        - {{ $host }}
      {{- if .tls.secretName }}
      secretName: {{ .tls.secretName }}
      {{- else }}
      secretName: {{ $controlIngressName }}-tls
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          {{- $ingressEdcEndpoints := .endpoints }}
          {{- range $name, $mapping := $controlEdcEndpoints }}
          {{- if (has $name $ingressEdcEndpoints) }}
          - path: {{ $mapping.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $serviceName }}
                port:
                  number: {{ $mapping.port }}
          {{- end }}
          {{- end }}
  {{- end }}
{{- end }}{{- /* end: if .enabled */}}
{{- end }}{{- /* end: range .Values.controlplane.ingresses */}}
