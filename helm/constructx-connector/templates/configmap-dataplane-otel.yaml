---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "conxdc.fullname" . }}-dataplane-otel
  namespace: {{ .Release.Namespace | default "default" | quote }}
  labels:
    {{- include "conxdc.dataplane.labels" . | nindent 4 }}
data:
  opentelemetry.properties: |-
    {{- trimSuffix "\n" .Values.dataplane.opentelemetry | nindent 4 }}
    {{- /* bind the prometheus exporter to dataplane.endpoints.metrics, unless set explicitly */}}
    {{- if not (contains "otel.exporter.prometheus.port" .Values.dataplane.opentelemetry) }}
    {{- "" | nindent 4 }}
    otel.exporter.prometheus.port={{ .Values.dataplane.endpoints.metrics.port }}
    {{- end }}