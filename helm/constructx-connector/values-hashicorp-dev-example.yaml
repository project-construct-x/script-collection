#################################################################################
# Example override values — constructx-connector
# Mode: hashicorp-dev  (bundled HashiCorp Vault in dev mode, in-memory)
#################################################################################

shared:
    connectorId: &connectorId did:web:user-wallet.staging.construct-x.net:user
    secretAlias: &secretAlias usersecret
    trustedIssuerId: &trustedIssuerId did:web:issuer.staging.construct-x.net:issuer
    clusterIssuer: &clusterIssuer letsencrypt-staging
    ingressClass: &ingressClass nginx
    imagePullSecret: &imagePullSecret registry-creds
    controlplaneFqdn: &controlplaneFqdn user-edc-controlplane.staging.construct-x.net
    dataplaneFqdn: &dataplaneFqdn user-edc-dataplane.staging.construct-x.net

nameOverride: user-edc
fullnameOverride: user-edc

participant:
    id: *connectorId

iatp:
    id: *connectorId
    trustedIssuerId: *trustedIssuerId
    trustedIssuers:
        - id: *trustedIssuerId
    sts:
        oauth:
            token_url: https://user-wallet.staging.construct-x.net/api/sts/token
            client:
                id: *connectorId
                secret_alias: *secretAlias
    didService:
        selfRegistration:
            id: *connectorId

vaultInit:
  mode: hashicorp-dev
  enabled: true
  rsa:
    privateAlias: "user_priv"
    publicAlias: "user_pub"
  autoInit:
    enabled: false

controlplane:
    hostname: user-edc-controlplane
    imagePullSecrets:
        - name: *imagePullSecret
    ingresses:
        ## Public / Internet facing Ingress
        - enabled: true
          hostname: *controlplaneFqdn
          annotations:
              cert-manager.io/cluster-issuer: *clusterIssuer
              external-dns.alpha.kubernetes.io/hostname: *controlplaneFqdn
              external-dns.alpha.kubernetes.io/ttl: "300"
          endpoints:
              - protocol
          className: *ingressClass
          tls:
              enabled: true
              secretName: user-edc-cp-tls
          certManager:
              clusterIssuer: *clusterIssuer
        ## Private / Intranet facing Ingress
        - enabled: false
          hostname: *controlplaneFqdn
          annotations:
              cert-manager.io/cluster-issuer: *clusterIssuer
              external-dns.alpha.kubernetes.io/hostname: *controlplaneFqdn
              external-dns.alpha.kubernetes.io/ttl: "300"
          endpoints:
              - management
              - control
              - validation
              - metrics
          className: *ingressClass
          tls:
              enabled: true
              secretName: user-edc-cp-int-tls
          certManager:
              clusterIssuer: *clusterIssuer

dataplane:
    hostname: user-edc-dataplane
    imagePullSecrets:
        - name: *imagePullSecret
    ingresses:
        ## Public / Internet facing Ingress
        - enabled: true
          hostname: *dataplaneFqdn
          annotations:
              cert-manager.io/cluster-issuer: *clusterIssuer
              external-dns.alpha.kubernetes.io/hostname: *dataplaneFqdn
              external-dns.alpha.kubernetes.io/ttl: "300"
          endpoints:
              - public
              - proxy
          className: *ingressClass
          tls:
              enabled: true
              secretName: user-edc-dp-tls
          certManager:
              clusterIssuer: *clusterIssuer
        ## Private / Intranet facing Ingress
        - enabled: false
          hostname: *dataplaneFqdn
          annotations:
              cert-manager.io/cluster-issuer: *clusterIssuer
              external-dns.alpha.kubernetes.io/hostname: *dataplaneFqdn
              external-dns.alpha.kubernetes.io/ttl: "300"
          endpoints:
              - management
              - control
              - metrics
          className: *ingressClass
          tls:
              enabled: true
              secretName: user-edc-dp-int-tls
          certManager:
              clusterIssuer: *clusterIssuer

postgresql:
    persistence:
        enabled: true
        size: 10Gi
        storageClass: ""

vault:
  server:
    dev:
      enabled: true
      # WARNING: dev-mode default token. Change before use.
      devRootToken: "root"
  hashicorp:
    url: "http://{{ .Release.Name }}-vault:8200"
    # WARNING: dev-mode default token. Change before use.
    token: "root"