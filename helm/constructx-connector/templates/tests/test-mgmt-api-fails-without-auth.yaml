---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "conxdc.fullname" . }}-controlplane-without-auth-test"
  labels:
    {{- include "conxdc.controlplane.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": {{ .Values.tests.hookDeletePolicy }}
spec:
  {{- include "conxdc.imagePullSecrets" (dict "context" $) | nindent 2 }}
  containers:
    {{/* Try calling a management API endpoint without authorization header */}}
    - name: management-api-call-without-auth
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      command: ["/bin/sh", "-c"]
      args:
        - |
          url="{{ printf "http://%s:%v%s/v3/assets/request" (include "conxdc.serviceHostname" (dict "context" $ "plane" "controlplane")) .Values.controlplane.endpoints.management.port .Values.controlplane.endpoints.management.path }}"
          code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -X POST -H "Content-Type: application/json" \
            -d '{"@context":{"@vocab":"https://w3id.org/edc/v0.0.1/ns/"},"@type":"QuerySpec"}' "$url")
          echo "POST $url without X-Api-Key -> HTTP $code (expected 401)"
          [ "$code" = "401" ]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
  restartPolicy: Never