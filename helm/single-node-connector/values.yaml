---

# -- Values shared by connector and wallet.
global:
  participant:
    # -- DID of the participant. Must resolve via the wallet hostname (global.wallet.hostname or wallet.ingresses[0].hostname).
    did: "did:web:wallet.staging.construct-x.net:user"
  connector:
    # -- Fullname of the connector
    fullname: "edc"
    controlplane:
      hostname: "controlplane.staging.construct-x.net"
    dataplane:
      hostname: "dataplane.staging.construct-x.net"
  wallet:
    # -- Fullname of the wallet.
    fullname: "wallet"
    hostname: "wallet.staging.construct-x.net"
  vault:
    url: "http://{{ .Release.Name }}-vault:8200"
    # -- Must match constructx-connector.vault.server.dev.devRootToken in dev mode
    token: "root"
    secretPath: "/v1/secret"
    mode: "hashicorp-dev"
    autoInit:
      enabled: false
      keysSecretName: "constructx-vault-keys"
  postgresql:
    host: "{{ .Release.Name }}-postgresql"
    port: 5432
  ingress:
    className: "nginx"
    clusterIssuer: "letsencrypt-staging"
  imagePullSecrets: []

constructx-connector:
  # -- The connector provides the shared Vault and PostgreSQL
  install:
    vault: true
    postgresql: true
  vault:
    server:
      dev:
        enabled: true
        devRootToken: "root"
  postgresql:
    auth:
      database: "edc"
      username: "edc"
      # WARNING: default password — change before use.
      password: "password"
    # -- Second database and user for the wallet, credentials are read from the wallet Secret derived from wallet fullname
    customUser:
      existingSecret: "{{ .Values.global.wallet.fullname }}-datasource-credentials"
      # -- Wallet database. Must match wallet.postgresql.auth.database
      database: "wallet"
      secretKeys:
        name: "EDC_DATASOURCE_DEFAULT_USER"
        password: "EDC_DATASOURCE_DEFAULT_PASSWORD"
        database: ""                # empty = customUser.database
  iatp:
    trustedIssuers:
      - id: "did:web:issuer.staging.construct-x.net:issuer"
    sts:
      oauth:
        # -- Cluster-internal STS endpoint of the wallet (service <global.wallet.fullname>, port wallet.wallet.endpoints.sts.port)
        token_url: "http://wallet:9292/api/sts/token"
        client:
          secret_alias: "usersecret"
  vaultInit:
    rsa:
      enabled: true
      # -- Must not collide with wallet aliases in the shared secret path
      privateAlias: "user_priv"
      publicAlias: "user_pub"
  controlplane:
    ingresses:
      - enabled: true
        endpoints: [protocol]
        tls: { enabled: true, secretName: "edc-cp-tls" }
  dataplane:
    ingresses:
      - enabled: true
        endpoints: [public, proxy]
        tls: { enabled: true, secretName: "edc-dp-tls" }

wallet:
  install:
    vault: false
    postgresql: false
  postgresql:
    auth:
      database: "wallet"
      username: "wallet"
      # WARNING: default password — change before use.
      password: "password"
  vaultInit:
    aes:
      enabled: true
      alias: "wallet-aes-key-alias"
  wallet:
    superuser:
      createSecret: true
      id: admin
      # WARNING: default API key. Format base64(<id>).<suffix>. Change before use.
      apiKey: YWRtaW4.adminKey
    ingresses:
      - enabled: true
        endpoints: [credentials, did, sts]
        tls: { enabled: true, secretName: "wallet-tls" }