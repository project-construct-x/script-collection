---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "conxdc.fullname" . }}-dataplane
  namespace: {{ .Release.Namespace | default "default" | quote }}
  labels:
    {{- include "conxdc.dataplane.labels" . | nindent 4 }}
data:
  ############
  # DEFAULTS #
  ############
  EDC_IAM_DID_WEB_USE_HTTPS: "true"
  EDC_DATA_PLANE_SELF_UNREGISTRATION: "true"
  EDC_IAM_CREDENTIAL_REVOCATION_MIMETYPE: "application/json"

  #######
  # API #
  #######
  WEB_HTTP_PORT: {{ .Values.dataplane.endpoints.default.port | quote }}
  WEB_HTTP_PATH: {{ .Values.dataplane.endpoints.default.path | quote }}
  WEB_HTTP_MANAGEMENT_PORT: {{ .Values.dataplane.endpoints.management.port | quote }}
  WEB_HTTP_MANAGEMENT_PATH: {{ .Values.dataplane.endpoints.management.path | quote }}
  WEB_HTTP_CONTROL_PORT: {{ .Values.dataplane.endpoints.control.port | quote }}
  WEB_HTTP_CONTROL_PATH: {{ .Values.dataplane.endpoints.control.path | quote }}
  WEB_HTTP_PUBLIC_PORT: {{ .Values.dataplane.endpoints.public.port | quote }}
  WEB_HTTP_PUBLIC_PATH: {{ .Values.dataplane.endpoints.public.path | quote }}

  ###########
  # General #
  ###########
  EDC_HOSTNAME: {{ include "conxdc.serviceHostname" (dict "context" $ "plane" "dataplane") | quote }}
  EDC_SQL_SCHEMA_AUTOCREATE: {{ .Values.dataplane.schema.autocreate | quote }}
  EDC_RUNTIME_ID: {{ printf "%s-dataplane" (include "conxdc.fullname" .) | quote }}
  {{- if .Values.log4j2.enableJsonLogs }}
  LOG4J_CONFIGURATION_FILE: "/app/log4j2.yaml"
  {{- end }}

  ####################
  # ID CONFIGURATION #
  ####################
  EDC_PARTICIPANT_ID: {{ include "conxdc.participantDid" . | quote }}
  EDC_IAM_ISSUER_ID: {{ include "conxdc.participantDid" . | quote }}

  ##########################
  # CONTROL / SELECTOR URL #
  ##########################
  EDC_CONTROL_ENDPOINT: {{ include "conxdc.dataplane.url.control" . | quote }}
  EDC_DPF_SELECTOR_URL: {{ printf "%s/v1/dataplanes" (include "conxdc.controlplane.url.control" .) | quote }}
  EDC_DATAPLANE_API_PUBLIC_BASEURL: {{ include "conxdc.dataplane.url.public" . | quote }}

  #######
  # AWS #
  #######
  {{- if .Values.dataplane.aws.endpointOverride }}
  EDC_AWS_ENDPOINT_OVERRIDE: {{ .Values.dataplane.aws.endpointOverride | quote }}
  {{- end }}

  #########
  # VAULT #
  #########
  EDC_VAULT_HASHICORP_URL: {{ include "conxdc.vault.url" . | quote }}
  EDC_VAULT_HASHICORP_TIMEOUT_SECONDS: {{ .Values.vault.hashicorp.timeout | quote }}
  EDC_VAULT_HASHICORP_HEALTH_CHECK_ENABLED: {{ .Values.vault.hashicorp.healthCheck.enabled | quote }}
  EDC_VAULT_HASHICORP_HEALTH_CHECK_STANDBY_OK: {{ .Values.vault.hashicorp.healthCheck.standbyOk | quote }}
  EDC_VAULT_HASHICORP_API_SECRET_PATH: {{ include "conxdc.vault.secretPath" . | quote }}
  EDC_VAULT_HASHICORP_API_HEALTH_CHECK_PATH: {{ .Values.vault.hashicorp.paths.health | quote }}
  {{- if .Values.vault.hashicorp.paths.folder }}
  EDC_VAULT_HASHICORP_FOLDER: {{ .Values.vault.hashicorp.paths.folder | quote }}
  {{- end }}

  ###########################
  # IATP / STS / DIV CONFIG #
  ###########################
  EDC_IAM_STS_OAUTH_TOKEN_URL: {{ .Values.iatp.sts.oauth.token_url | required ".Values.iatp.sts.oauth.token_url is required" | quote }}
  EDC_IAM_STS_OAUTH_CLIENT_ID: {{ include "conxdc.stsClientId" . | quote }}
  EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS: {{ .Values.iatp.sts.oauth.client.secret_alias | required ".Values.iatp.sts.oauth.client.secret_alias is required" | quote }}
  {{- if .Values.iatp.sts.div.url }}
  TX_EDC_IAM_STS_DIV_URL: {{ .Values.iatp.sts.div.url | quote }}
  {{- end }}

  ##############
  # Datasource #
  ##############
  EDC_DATASOURCE_DEFAULT_URL: {{ include "conxdc.postgresql.jdbcUrl" . | quote }}

  #################
  # TOKEN REFRESH #
  #################
  {{- if .Values.dataplane.token.refresh.expiry_seconds }}
  TX_EDC_DATAPLANE_TOKEN_EXPIRY: {{ .Values.dataplane.token.refresh.expiry_seconds | quote }}
  {{- end }}
  {{- if .Values.dataplane.token.refresh.expiry_tolerance_seconds }}
  TX_EDC_DATAPLANE_TOKEN_EXPIRY_TOLERANCE: {{ .Values.dataplane.token.refresh.expiry_tolerance_seconds | quote }}
  {{- end }}
  {{- if .Values.dataplane.token.refresh.refresh_endpoint }}
  TX_EDC_DATAPLANE_TOKEN_REFRESH_ENDPOINT: {{ .Values.dataplane.token.refresh.refresh_endpoint | quote }}
  {{- else }}
  TX_EDC_DATAPLANE_TOKEN_REFRESH_ENDPOINT: {{ printf "%s/token" (include "conxdc.dataplane.url.public" .) | quote }}
  {{- end }}

  ###############
  # RSA ALIASES #
  ###############
  EDC_TRANSFER_PROXY_TOKEN_SIGNER_PRIVATEKEY_ALIAS: {{ include "conxdc.signerAlias" . | quote }}
  EDC_TRANSFER_PROXY_TOKEN_VERIFIER_PUBLICKEY_ALIAS: {{ include "conxdc.verifierAlias" . | quote }}