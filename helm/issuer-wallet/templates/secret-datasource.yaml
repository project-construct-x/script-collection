apiVersion: v1
kind: Secret
metadata:
  name: {{ include "issuer-wallet.datasourceSecretName" . }}
  namespace: {{ .Release.Namespace | default "default" | quote }}
  labels:
    {{- include "issuer-wallet.labels" . | nindent 4 }}
type: Opaque
stringData:
  ################
  ## POSTGRESQL ##
  ################
  # default
  EDC_DATASOURCE_DEFAULT_USER: {{ .Values.postgresql.auth.username | required ".Values.postgresql.auth.username is required" | quote }}
  EDC_DATASOURCE_DEFAULT_PASSWORD: {{ .Values.postgresql.auth.password | required ".Values.postgresql.auth.password is required" | quote }}
  {{- if and (eq (include "issuer-wallet.usesHashicorpVault" .) "true") (ne (include "issuer-wallet.vault.autoInit.enabled" .) "true") }}
  #####################
  ## HASHICORP VAULT ##
  #####################
  EDC_VAULT_HASHICORP_TOKEN: {{ include "issuer-wallet.vault.token" . | required "vault.hashicorp.token or global.vault.token is required" | quote }}
  {{- end }}
  