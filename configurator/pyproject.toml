[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cx_edc_client"
version = "0.1.0"
description = "Python client for Construct-X EDC connector workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<9",
    "ruff>=0.15,<1",
]

[project.scripts]
edc = "edc_cli:main"

[tool.setuptools]
package-dir = {"" = "src","flows" = "flows"}
py-modules = [
    "edc_cli",
    "client",
    "config",
    "catalog",
    "credentials",
    "deploy",
    "exceptions",
    "http_client",
    "identity",
    "onboarding",
    "payloads",
    "publish",
    "request",
    "runtime",
    "state",
    "util",
]
packages = ["flows"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]

