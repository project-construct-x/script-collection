#################################################################################
# Example override values — wallet
# Mode: hashicorp-persistent (persistent HashiCorp Vault, auto-initialised)
#################################################################################

fullnameOverride: "user-wallet"
nameOverride: "user-wallet"

install:
  postgresql: true
  vault: true

imagePullSecrets:
  - name: ghcr-creds

# -- Secret initialisation
vaultInit:
  mode: hashicorp-persistent
  enabled: true
  aes:
    enabled: true
    alias: "wallet-aes-key-alias"
  autoInit:
    enabled: true
    keysSecretName: "wallet-vault-keys"
    # -- Vault auto-unseal
    unsealer:
      enabled: true
      # Seconds between two seal status checks.
      interval: 60

wallet:
  image:
    repository: "ghcr.io/project-construct-x/wallet"
  superuser:
    createSecret: true
    id: cx-user
    # WARNING: default API key. Format base64(<id>).<suffix>. Change before use.
    apiKey: Y3gtdXNlcg==.adminKey
  # -- Public ingress
  ingresses:
    - enabled: true
      hostname: "user-wallet.services.construct-x.net"
      className: "nginx"
      endpoints: [credentials, did, sts]
      tls:
        enabled: true
        secretName: "user-wallet-tls"
      certManager:
        clusterIssuer: "letsencrypt-serv"

postgresql:
  auth:
    database: "wallet"
    username: "constructx-user"
    # WARNING: default password — change before use.
    password: "xHNmg3uWPK2UQKqw"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

vault:
  server:
    dev:
      enabled: false
    dataStorage:
      enabled: true
      size: 1Gi
      storageClass: ""
    auditStorage:
      enabled: true
      size: 1Gi
      storageClass: ""
