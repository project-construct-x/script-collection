#################################################################################
# Example override values — issuer-wallet
# Mode: postgres  (PostgreSQL SQL vault — no HashiCorp Vault)
#################################################################################

install:
  postgresql: true
  vault: false

imagePullSecrets: []

# -- Secret initialisation
vaultInit:
  mode: postgres
  enabled: true
  aes:
    enabled: true
    alias: "issuer-wallet-aes-key-alias"
  autoInit:
    enabled: false

wallet:
  # -- Public hostname. Used in did:web URLs and ingress routing. 
  hostname: "issuer.staging.construct-x.net"

  image:
    repositoryPsqlWallet: "ghcr.io/project-construct-x/wallet-sql-vault"

  superuser:
    createSecret: true
    id: admin
    # WARNING: default API key. Format base64(<id>).<random>. Change before use.
    apiKey: YWRtaW4.adminKey

  ingresses:
    - enabled: true
      hostname: "issuer.staging.construct-x.net"
      className: "nginx"
      endpoints: [issuance, sts, did, statuslist]
      tls:
        enabled: true
        secretName: "issuer-wallet-tls"
      certManager:
        clusterIssuer: "letsencrypt-staging"

postgresql:
  auth:
    database: "issuer"
    username: "user"
    # WARNING: default password — change before use.
    password: "password"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
