name: workshop-issuer
services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: issuer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U admin -d issuer"]
      interval: 3s
      timeout: 3s
      retries: 30

  vault:
    image: ghcr.io/project-construct-x/hashimock:latest
    restart: unless-stopped
    environment:
      HASHIMOCK_TOKEN: ${VAULT_TOKEN:?set VAULT_TOKEN}
      HASHIMOCK_DATA_DIR: /data/secrets
    volumes:
      - vault:/data/secrets

  vault-init:
    image: alpine:3.19
    depends_on:
      - vault
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:?set VAULT_TOKEN}
      DP_KEY_PREFIX: unused
      WALLET_AES_ALIAS: issuer-aes
    volumes:
      - ../../configurator/docker/vault-init.sh:/init.sh:ro
    entrypoint: [sh, -c, "apk add --no-cache curl jq openssl && tr -d '\r' < /init.sh > /tmp/init.sh && sh /tmp/init.sh"]

  wallet:
    image: ${WALLET_IMAGE:?set WALLET_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      EDC_HOSTNAME: wallet
      EDC_IAM_DID_WEB_USE_HTTPS: "true"
      EDC_IH_API_SUPERUSER_ID: admin
      EDC_IH_API_KEY_SUPERUSER: ${WALLET_SUPERUSER_KEY:?set WALLET_SUPERUSER_KEY}
      EDC_IAM_KEY_ALGORITHM: RSA
      EDC_IH_API_SUPERUSER_PUBLIC_KEY_ALIAS: workshop-admin#pubkey
      EDC_IH_API_SUPERUSER_PRIVATE_KEY_ALIAS: workshop-admin#privkey
      EDC_ENCRYPTION_AES_KEY_ALIAS: issuer-aes
      EDC_ISSUER_STATUSLIST_SIGNING_KEY_ALIAS: did:web:${ISSUER_DOMAIN}:${ISSUER_CONTEXT}-alias
      EDC_STATUSLIST_CALLBACK_ADDRESS: https://${ISSUER_DOMAIN}/${ISSUER_CONTEXT}/statuslist
      EDC_ISSUER_ISSUANCE_SEND_RETRY_LIMIT: 0
      WEB_HTTP_DID_PORT: 80
      EDC_SQL_SCHEMA_AUTOCREATE: "true"
      EDC_DATASOURCE_DEFAULT_URL: jdbc:postgresql://postgres:5432/issuer
      EDC_DATASOURCE_DEFAULT_USER: admin
      EDC_DATASOURCE_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      EDC_VAULT_HASHICORP_URL: http://vault:8200
      EDC_VAULT_HASHICORP_TOKEN: ${VAULT_TOKEN:?set VAULT_TOKEN}
      EDC_VAULT_HASHICORP_HEALTH_CHECK_ENABLED: "true"
    ports:
      - 127.0.0.1:30100:15151
      - 127.0.0.1:30200:15152
    networks:
      default:
      ingress:
        aliases:
          - workshop-issuer-wallet

volumes:
  postgres:
  vault:

networks:
  ingress:
    external: true
    name: aas-repository_frontend
