#################################################################################
# Example override values — issuer-wallet
# Mode: hashicorp-persistent (persistent HashiCorp Vault, auto-initialised)
#################################################################################

install:
  postgresql: true
  vault: true

imagePullSecrets: []

# -- Secret initialisation
vaultInit:
  mode: hashicorp-persistent
  enabled: true
  aes:
    enabled: true
    alias: "issuer-wallet-aes-key-alias"
  autoInit:
    enabled: true

wallet:
  image:
    repositoryVaultWallet: "ghcr.io/project-construct-x/wallet"
  superuser:
    createSecret: true
    id: admin
    # WARNING: default API key. Format base64(<id>).<suffix>. Change before use.
    apiKey: YWRtaW4.adminKey
  # -- Public ingress
  ingresses:
    - enabled: true
      hostname: "issuer.staging.construct-x.net"
      className: "nginx"
      endpoints: [issuance, sts, did, statuslist]
      tls:
        enabled: true
        secretName: "issuer-wallet-tls"
      certManager:
        clusterIssuer: "letsencrypt-staging"

postgresql:
  auth:
    database: "issuer"
    username: "user"
    # WARNING: default password — change before use.
    password: "password"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

vault:
  server:
    dev:
      enabled: false
    dataStorage:
      enabled: true
      size: 1Gi
      storageClass: ""
    auditStorage:
      enabled: true
      size: 1Gi
      storageClass: ""
