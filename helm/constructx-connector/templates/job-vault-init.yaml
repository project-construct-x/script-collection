{{- if eq (include "common.vaultInit.jobEnabled" .) "true" -}}
{{- $fullName := include "conxdc.fullname" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullName }}-vault-init
  namespace: {{ .Release.Namespace | default "default" | quote }}
  labels:
    {{- include "conxdc.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "conxdc.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "conxdc.serviceAccountName" . }}
{{- if .Values.vaultInit.autoInit.enabled }}
      # Ensure that SA Token is mounted
      automountServiceAccountToken: true
{{- end }}
      containers:
        - name: vault-init
          image: {{ .Values.vaultInit.image.repository }}:{{ .Values.vaultInit.image.tag }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              tr -d '\r' < /scripts/init.sh > /tmp/init.sh
              exec sh /tmp/init.sh
          env:
            - name: VAULT_ADDR
              value: {{ tpl .Values.vault.hashicorp.url . | quote }}
            - name: VAULT_TOKEN
              value: {{ .Values.vault.hashicorp.token | quote }}
            - name: VAULT_SECRET_PATH
              value: {{ .Values.vault.hashicorp.paths.secret | quote }}
            - name: VAULT_HEALTH_PATH
              value: {{ .Values.vault.hashicorp.paths.health | quote }}
            - name: FORCE_REGENERATE
              value: {{ .Values.vaultInit.forceRegenerate | quote }}
            # --- AES ---
            - name: AES_ENABLED
              value: {{ .Values.vaultInit.aes.enabled | quote }}
            - name: AES_ALIAS
              value: {{ .Values.vaultInit.aes.alias | default "" | quote }}
            # --- RSA ---
            - name: RSA_ENABLED
              value: {{ .Values.vaultInit.rsa.enabled | quote }}
            - name: RSA_PRIV_ALIAS
              value: {{ .Values.vaultInit.rsa.privateAlias | default "" | quote }}
            - name: RSA_PUB_ALIAS
              value: {{ .Values.vaultInit.rsa.publicAlias | default "" | quote }}
          {{- if .Values.vaultInit.autoInit.enabled }}
            # --- Auto-Init (hashicorp-persistent mode only) ---
            - name: AUTO_INIT
              value: "true"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KEYS_SECRET_NAME
              value: {{ .Values.vaultInit.autoInit.keysSecretName | quote }}
            - name: KV_MOUNT
              value: {{ .Values.vaultInit.autoInit.kvMount | quote }}
            - name: AUDIT_PATH
              value: {{ .Values.vaultInit.autoInit.auditPath | quote }}
            - name: APP_TOKEN_SECRET_NAME
              value: {{ printf "%s-vault-deployment-token" .Values.fullnameOverride | quote }}
            - name: APP_POLICY_NAME
              value: "deployment"
          {{- end }}
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: {{ $fullName }}-vault-init
            defaultMode: 0555
{{- end }}