---
{{- if not .Values.controlplane.endpoints.management.jwksUrl }}
{{- $cpHost := include "conxdc.serviceHostname" (dict "context" $ "plane" "controlplane") }}
---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "conxdc.fullname" . }}-controlplane-with-auth-test"
  labels:
    {{- include "conxdc.controlplane.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": {{ .Values.tests.hookDeletePolicy }}
spec:
  {{- include "conxdc.imagePullSecrets" (dict "context" $) | nindent 2 }}
  containers:
    {{- /* Poke the readiness endpoint of the control plane */}}
    - name: readiness
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      command: ["curl", "-fsS", "--max-time", "10", "-o", "/dev/null"]
      args: ["http://{{ $cpHost }}:{{ .Values.controlplane.endpoints.default.port }}{{ .Values.controlplane.endpoints.default.path }}/check/readiness"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
    {{- /* Read-only management API call with X-Api-Key */}}
    - name: management-api-call-with-auth
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      command: ["/bin/sh", "-c"]
      args:
        - |
          curl -fsS --max-time 10 -o /dev/null -X POST \
            -H "Content-Type: application/json" -H "X-Api-Key: $API_KEY" \
            -d '{"@context":{"@vocab":"https://w3id.org/edc/v0.0.1/ns/"},"@type":"QuerySpec"}' \
            "http://{{ $cpHost }}:{{ .Values.controlplane.endpoints.management.port }}{{ .Values.controlplane.endpoints.management.path }}/v3/assets/request"
      env:
        # API key is read from the control plane Secret instead of being rendered into the pod spec
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "conxdc.fullname" . }}-controlplane
              key: WEB_HTTP_MANAGEMENT_AUTH_KEY
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
  restartPolicy: Never
  securityContext:
    fsGroup: 101 # curl_group
    runAsGroup: 101 # curl_group
    runAsNonRoot: true
    runAsUser: 100 # curl_user
    seccompProfile:
      type: RuntimeDefault
{{- end }}