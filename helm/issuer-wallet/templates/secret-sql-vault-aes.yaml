{{- if and (eq .Values.wallet.secretStorage "postgresql") .Values.wallet.aesKey.enabled }}
{{- $fullName := .Values.fullnameOverride -}}
{{- $alias := include "issuer-wallet.aesKeyAlias" . -}}
{{- $secretName := printf "%s-sql-vault-aes" $fullName -}}

# Check for existing Secret
{{- $existing := (lookup "v1" "Secret" (.Release.Namespace | default "default") $secretName) -}}
{{- $key := "" -}}

# Use existing Key or generate new one
{{- if and $existing $existing.data (index $existing.data $alias) -}}
  {{- $key = (index $existing.data $alias | b64dec) -}}
{{- else -}}
  {{- $key = (randBytes 32) -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace | default "default" | quote }}
  labels:
    {{- include "issuer-wallet.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $alias }}: {{ $key | quote }}
{{- end }}