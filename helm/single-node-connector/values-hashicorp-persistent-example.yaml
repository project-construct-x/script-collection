#################################################################################
# Example override values — single-node-connector
# Mode: hashicorp-persistent (persistent HashiCorp Vault, auto-initialised)
#################################################################################

global:
  participant:
    # -- DID of the participant. Must resolve via the wallet hostname.
    did: "did:web:user-wallet.staging.construct-x.net:user"
  connector:
    controlplane:
      hostname: "user-edc-controlplane.staging.construct-x.net"
    dataplane:
      hostname: "user-edc-dataplane.staging.construct-x.net"
  wallet:
    hostname: "user-wallet.staging.construct-x.net"
  vault:
    mode: "hashicorp-persistent"
    # -- Not needed with autoInit, the apps read their scoped token from <fullname>-vault-deployment-token
    token: ""
    autoInit:
      enabled: true
      keysSecretName: "user-edc-vault-keys"
  ingress:
    className: "nginx"
    # -- Also sets the cert-manager.io/cluster-issuer annotation
    clusterIssuer: "letsencrypt-staging"
  # -- Used by connector and wallet
  imagePullSecrets:
    - name: "registry-creds"

constructx-connector:
  vault:
    server:
      dev:
        enabled: false
      dataStorage:
        enabled: true
        size: 1Gi
        storageClass: ""
      auditStorage:
        enabled: true
        size: 1Gi
        storageClass: ""
  postgresql:
    auth:
      # WARNING: default password — change before use.
      password: "password"
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
  iatp:
    trustedIssuers:
      - id: "did:web:issuer.staging.construct-x.net:issuer"
    sts:
      oauth:
        client:
          secret_alias: "usersecret"
    defaultScope:
      type: "https://w3id.org/constructx/credentials/v1.0/ConstructXMembershipCredential"

wallet:
  postgresql:
    auth:
      # WARNING: default password — change before use. Also used by PostgreSQL to create the wallet user (customUser).
      password: "password"
  wallet:
    superuser:
      createSecret: true
      id: admin
      # WARNING: default API key. Format base64(<id>).<suffix>. Change before use.
      apiKey: YWRtaW4.adminKey